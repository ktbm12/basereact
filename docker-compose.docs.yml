services:
  docs:
    image: tontine_kamologne_cameroun_local_docs
    container_name: tontine_kamologne_cameroun_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./tontine_kamologne_cameroun:/app/tontine_kamologne_cameroun:z
    ports:
      - '9000:9000'
    command: /start-docs
